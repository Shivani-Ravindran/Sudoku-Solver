<!DOCTYPE html>
<html>
  <head>
    <title>Sudoku Solver</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <h2>Sudoku Solver</h2>
    <h3>Input</h3>
    <div id="input-grid" class="grid"></div>

    <h3>Solvers</h3>
    <div class="solver-row">
    <div>
        <p>Naive DFS</p>
        <div id="naive-grid" class="grid"></div>
        <p class="dfs-msg">&nbsp;</p>
    </div>
    <div>
        <p>Best First</p>
        <div id="best-grid" class="grid"></div>
        <p class="bfs-msg">&nbsp;</p>
    </div>
    <div>
        <p>Genetic Algorithm</p>
        <div id="ga-grid" class="grid"></div>
        <p class="ga-msg">&nbsp;</p>
    </div>
    </div>

    <button class="solveBtn">Solve</button>
    <button class="benchmarkBtn">Benchmark</button>
    <button onclick="clearGrid()">Clear</button>
    <p id="message"></p>

    <div id="benchmark-results" style="display: none; margin-top: 30px;">
        <h3>Benchmark Results</h3>
        <div class="stats-container" id="benchmark-stats"></div>
        <div style="max-width: 600px; margin: 0 auto;">
            <canvas id="benchmarkChart"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
